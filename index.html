<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#8B5CF6',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-custom {
                background: linear-gradient(135deg, #4F46E5 0%, #8B5CF6 100%);
            }
            .shadow-custom {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .transition-all-300 {
                transition: all 300ms ease-in-out;
            }
            .glow-btn {
                position: relative;
                overflow: hidden;
            }
            .glow-btn::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
                transform: scale(0);
                transition: transform 0.6s ease-out;
                pointer-events: none;
            }
            .glow-btn:hover::before {
                transform: scale(1);
            }
            .glow-btn::after {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
                transition: left 0.5s ease;
                pointer-events: none;
            }
            .glow-btn:hover::after {
                left: 100%;
            }
            .glow-border {
                position: relative;
            }
            .glow-border::before {
                content: '';
                position: absolute;
                inset: -2px;
                border-radius: inherit;
                background: linear-gradient(45deg, #4F46E5, #8B5CF6, #4F46E5);
                background-size: 200% 200%;
                animation: glow-animation 3s ease infinite;
                opacity: 0;
                transition: opacity 0.3s ease;
                z-index: -1;
            }
            .glow-border:hover::before,
            .glow-border.active::before {
                opacity: 1;
            }
            @keyframes glow-animation {
                0%, 100% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
            }
            .login-glow {
                box-shadow: 0 0 20px rgba(79, 70, 229, 0.5), 0 0 40px rgba(79, 70, 229, 0.3), 0 0 60px rgba(79, 70, 229, 0.1);
                animation: pulse-glow 2s ease-in-out infinite;
            }
            @keyframes pulse-glow {
                0%, 100% { box-shadow: 0 0 20px rgba(79, 70, 229, 0.5), 0 0 40px rgba(79, 70, 229, 0.3), 0 0 60px rgba(79, 70, 229, 0.1); }
                50% { box-shadow: 0 0 30px rgba(79, 70, 229, 0.7), 0 0 60px rgba(79, 70, 229, 0.5), 0 0 90px rgba(79, 70, 229, 0.2); }
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-dark flex items-center justify-center p-4">
    <!-- 登录卡片容器 -->
    <div class="w-full max-w-md">
        <!-- 登录卡片 -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-custom overflow-hidden transition-all-300 transform hover:translate-y-[-5px]">
            <!-- 顶部渐变装饰条 -->
            <div class="h-2 bg-gradient-custom"></div>
            
            <!-- 登录表单 -->
            <div class="p-8">
                <!-- 登录标题 -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-24 h-24 bg-primary/10 rounded-full mb-4">
                        <img src="backend/img/myspellpal.png" alt="MySpellPal" class="w-24 h-24 object-contain">
                    </div>
                    <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark dark:text-white">欢迎回来</h1>
                    <p class="text-gray-500 dark:text-gray-400 mt-2">请输入您的账号信息登录</p>
                </div>
                
                <!-- 表单 -->
                <form id="loginForm" class="space-y-4">
                    <!-- 用户名输入框 -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" 
                            class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 
                                   bg-gray-50 dark:bg-gray-900 dark:text-white placeholder-gray-400
                                   transition-all-300 input-focus" 
                            placeholder="用户名" required>
                    </div>
                    
                    <!-- 密码输入框 -->
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" 
                            class="w-full pl-10 pr-10 py-3 rounded-lg border border-gray-300 dark:border-gray-700 
                                   bg-gray-50 dark:bg-gray-900 dark:text-white placeholder-gray-400
                                   transition-all-300 input-focus" 
                            placeholder="密码" required>
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-primary transition-colors">
                            <i class="fa fa-eye-slash"></i>
                        </button>
                    </div>
                    
                    <!-- 登录身份选择 -->
                    <div class="relative">
                        <input type="hidden" id="loginRole" value="">
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" id="studentRoleBtn" 
                                class="glow-border w-full py-3 px-4 rounded-lg border border-gray-300 dark:border-gray-700 
                                       bg-gray-50 dark:bg-gray-900 text-gray-700 dark:text-white
                                       transition-all-300 input-focus relative z-10">
                                学生
                            </button>
                            <button type="button" id="teacherRoleBtn" 
                                class="glow-border w-full py-3 px-4 rounded-lg border border-gray-300 dark:border-gray-700 
                                       bg-gray-50 dark:bg-gray-900 text-gray-700 dark:text-white
                                       transition-all-300 input-focus relative z-10">
                                教师
                            </button>
                        </div>
                    </div>
                    
                    <!-- 记住我和忘记密码 -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" type="checkbox" 
                                class="w-4 h-4 text-primary bg-gray-100 dark:bg-gray-700 border-gray-300 dark:border-gray-600 rounded focus:ring-primary/50 transition-all-300">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                                记住我
                            </label>
                        </div>
                        <a href="#" id="forgotPasswordLink" class="text-sm font-medium text-primary hover:text-secondary transition-colors">
                            忘记密码？
                        </a>
                    </div>
                    
                    <!-- 登录按钮 -->
                <button type="submit" 
                    class="glow-btn w-full bg-gradient-custom text-white font-medium py-3 px-4 rounded-lg 
                           transition-all-300 transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center relative z-10">
                    <i class="fa fa-sign-in mr-2"></i> 登录
                </button>
                
                <!-- 快速登录按钮 -->
                <!-- <button id="quickLoginBtn" 
                    class="w-full bg-secondary hover:bg-secondary/90 text-white font-medium py-3 px-4 rounded-lg 
                           transition-all-300 transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center mt-3">
                    <i class="fa fa-magic mr-2"></i> 快速登录（测试账号）
                </button> -->
                </form>
                

                
                <!-- 注册链接 -->
                <div class="text-center mt-6">
                    <p class="text-sm text-gray-600 dark:text-gray-400">
                        还没有账号？ 
                        <a href="#" id="registerLink" class="font-medium text-primary hover:text-secondary transition-colors">
                            立即注册
                        </a>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
            <p></p>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        // 密码显示/隐藏功能
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        
        togglePassword.addEventListener('click', function() {
            // 切换密码类型
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            // 切换图标
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        // 登录身份选择按钮功能
        const studentRoleBtn = document.getElementById('studentRoleBtn');
        const teacherRoleBtn = document.getElementById('teacherRoleBtn');
        const loginRole = document.getElementById('loginRole');
        
        // 学生按钮点击事件
        studentRoleBtn.addEventListener('click', function() {
            loginRole.value = 'student';
            
            studentRoleBtn.classList.remove('border-gray-300', 'dark:border-gray-700', 'bg-gray-50', 'dark:bg-gray-900', 'text-gray-700', 'dark:text-white');
            studentRoleBtn.classList.add('border-primary', 'bg-primary', 'text-white', 'active');
            
            teacherRoleBtn.classList.remove('border-primary', 'bg-primary', 'text-white', 'active');
            teacherRoleBtn.classList.add('border-gray-300', 'dark:border-gray-700', 'bg-gray-50', 'dark:bg-gray-900', 'text-gray-700', 'dark:text-white');
        });
        
        // 教师按钮点击事件
        teacherRoleBtn.addEventListener('click', function() {
            loginRole.value = 'teacher';
            
            teacherRoleBtn.classList.remove('border-gray-300', 'dark:border-gray-700', 'bg-gray-50', 'dark:bg-gray-900', 'text-gray-700', 'dark:text-white');
            teacherRoleBtn.classList.add('border-primary', 'bg-primary', 'text-white', 'active');
            
            studentRoleBtn.classList.remove('border-primary', 'bg-primary', 'text-white', 'active');
            studentRoleBtn.classList.add('border-gray-300', 'dark:border-gray-700', 'bg-gray-50', 'dark:bg-gray-900', 'text-gray-700', 'dark:text-white');
        });
        
        // 初始化时添加测试账号
        function initializeTestAccount() {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            // 检查测试账号是否已存在
            const testTeacherExists = users.some(user => user.username === 'js');
            const testStudentExists = users.some(user => user.username === 'xs');
            if (!testTeacherExists) {
                // 添加测试教师账号：用户名js，密码123456，身份教师
                users.push({ username: 'js', password: '123456', role: 'teacher' });
            }
            if (!testStudentExists) {
                // 添加测试学生账号：用户名xs，密码123456，身份学生
                users.push({ username: 'xs', password: '123456', role: 'student' });
            }
            localStorage.setItem('users', JSON.stringify(users));
        }
        
        // 表单提交处理
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginRole = document.getElementById('loginRole').value;
            
            if (!loginRole) {
                alert('请选择登录身份！');
                return;
            }
            
            // 从localStorage获取用户数据
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // 检查用户是否存在且密码正确且身份匹配
            const user = users.find(user => user.username === username && user.password === password && user.role === loginRole);
            
            // 显示提交动画效果
            const submitButton = this.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;
            
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fa fa-circle-o-notch fa-spin mr-2"></i> 登录中...';
            
            // 模拟登录请求
            setTimeout(() => {
                if (user) {
                    // 登录成功
                    submitButton.innerHTML = '<i class="fa fa-check mr-2"></i> 登录成功';
                    submitButton.classList.remove('bg-primary', 'hover:bg-primary/90');
                    submitButton.classList.add('bg-green-500', 'hover:bg-green-600');
                    
                    // 检查是否需要记住用户
                    const rememberMe = document.getElementById('remember-me').checked;
                    if (rememberMe) {
                        // 保存用户名和密码到localStorage
                        localStorage.setItem('rememberedUsername', username);
                        localStorage.setItem('rememberedPassword', password);
                    } else {
                        // 清除可能存在的保存
                        localStorage.removeItem('rememberedUsername');
                        localStorage.removeItem('rememberedPassword');
                    }
                    
                    // 保存当前登录用户信息
                    localStorage.setItem('currentUser', username);
                    localStorage.setItem('currentUserRole', loginRole);
                    
                    // 登录成功后跳转到相应页面
                    // 立即执行跳转，不使用setTimeout以避免可能的问题
                    if (loginRole === 'teacher') {
                        window.location.href = 'teacher-zhuye.html';
                    } else if (loginRole === 'student') {
                        window.location.href = 'zhuye.html';
                    }
                } else {
                    // 登录失败
                    submitButton.innerHTML = '<i class="fa fa-times mr-2"></i> 登录失败';
                    submitButton.classList.remove('bg-primary', 'hover:bg-primary/90');
                    submitButton.classList.add('bg-red-500', 'hover:bg-red-600');
                    
                    // 重置按钮
                    setTimeout(() => {
                        submitButton.disabled = false;
                        submitButton.innerHTML = originalText;
                        submitButton.classList.remove('bg-red-500', 'hover:bg-red-600');
                        submitButton.classList.add('bg-primary', 'hover:bg-primary/90');
                    }, 1000);
                }
            }, 1500);
        });
        
        // 页面加载时初始化测试账号
        initializeTestAccount();
        
        // 输入框聚焦时的额外动效
        const inputs = document.querySelectorAll('input');
        
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('scale-[1.02]');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('scale-[1.02]');
            });
        });
        
        // 支持深色模式检测
        function checkDarkMode() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }
        
        // 初始化检查深色模式
        checkDarkMode();
        
        // 监听深色模式变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', checkDarkMode);
        
        // 注册链接点击事件处理
        const registerLink = document.getElementById('registerLink');
        
        registerLink.addEventListener('click', function(event) {
            event.preventDefault(); // 阻止默认跳转行为
            
            // 跳转到注册页面
            window.location.href = 'register.html';
        });
        
        // 页面加载时检查是否有记住的用户名和密码
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            const rememberedPassword = localStorage.getItem('rememberedPassword');
            if (rememberedUsername) {
                // 填充用户名输入框
                document.getElementById('username').value = rememberedUsername;
                // 填充密码输入框
                if (rememberedPassword) {
                    document.getElementById('password').value = rememberedPassword;
                }
                // 选中记住我复选框
                document.getElementById('remember-me').checked = true;
            }
        });
        
        // 忘记密码功能
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        
        forgotPasswordLink.addEventListener('click', function(event) {
            event.preventDefault(); // 阻止默认跳转行为
            
            // 跳转到忘记密码页面
            window.location.href = 'forgot-password.html';
        });
        
        // 快速登录功能
        const quickLoginBtn = document.getElementById('quickLoginBtn');
        
        quickLoginBtn.addEventListener('click', function() {
            // 添加一个简单的交互，让用户选择快速登录的角色
            const role = prompt('请选择快速登录角色：\n1. 教师\n2. 学生\n\n输入 1 或 2：');
            
            if (role === '1') {
                // 填充测试教师账号信息：用户名js，密码123456，身份教师
                document.getElementById('username').value = 'js';
                document.getElementById('password').value = '123456';
                
                // 更新身份选择按钮状态
                teacherRoleBtn.click(); // 触发教师按钮点击事件
            } else if (role === '2') {
                // 填充测试学生账号信息：用户名xs，密码123456，身份学生
                document.getElementById('username').value = 'xs';
                document.getElementById('password').value = '123456';
                
                // 更新身份选择按钮状态
                studentRoleBtn.click(); // 触发学生按钮点击事件
            } else {
                alert('无效选择，请输入 1 或 2');
                return;
            }
            
            // 提交登录表单
            loginForm.dispatchEvent(new Event('submit'));
        });
        
        // 重置登录状态功能
        function resetLoginStatus() {
            // 清除localStorage中的登录信息
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentUserRole');
            localStorage.removeItem('rememberedUsername');
            localStorage.removeItem('rememberedPassword');
            
            console.log('登录状态已重置');
        }
        
        // 页面加载时检查登录状态，如果有问题则重置
        document.addEventListener('DOMContentLoaded', function() {
            // 检查localStorage中的登录信息是否完整
            const currentUser = localStorage.getItem('currentUser');
            const currentUserRole = localStorage.getItem('currentUserRole');
            
            // 如果只有部分登录信息，可能导致登录问题，重置登录状态
            if ((currentUser && !currentUserRole) || (!currentUser && currentUserRole)) {
                resetLoginStatus();
            }
        });
    </script>
</body>
</html>
